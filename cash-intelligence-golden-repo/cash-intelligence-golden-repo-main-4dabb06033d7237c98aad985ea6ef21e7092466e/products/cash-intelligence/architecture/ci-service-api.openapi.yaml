                  branches: { type: integer }
                  flaggedBranches: { type: integer }
                  overstockedTcrs: { type: integer, description: Overstocked TCRs within flagged branches (REQ-CI-BCP-002 card 2). }
                  lowShareAtRisk: { type: integer, description: Low-share devices projected to run empty within a week (card 3). }
                  configVersion: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /branch-positioning/branches:
    get:
      tags: [Branch Cash Positioning]
      operationId: listFlaggedBranches
      summary: Branches table with the share spread and flag
      description: |
        The branch-level flagging rule is partly open (§16 Q40, "branch as a whole not overstocked"). Sortable fields
        (REQ-CI-BCP-003) - branch, region, shareSpreadPct, flagged; default `-shareSpreadPct`.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-BCP-003, REQ-CI-BCP-004]
      x-ci-reads: [cash.device_daily_activity, cash.device_projection]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items, configVersion]
                    properties:
                      configVersion: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          required: [branch, region, shareSpreadPct, flagged, flags]
                          properties:
                            branch: { $ref: '#/components/schemas/LocationRef' }
                            region: { $ref: '#/components/schemas/LocationRef' }
                            shareSpreadPct: { type: number }
                            flagged: { type: boolean }
                            flags:
                              description: The chips of REQ-CI-BCP-003 criterion 3.
