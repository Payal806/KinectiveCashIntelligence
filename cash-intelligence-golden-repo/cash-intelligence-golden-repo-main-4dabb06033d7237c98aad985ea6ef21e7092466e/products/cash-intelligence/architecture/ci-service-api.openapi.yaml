openapi: 3.2.0
# ci-service API contract (design §2b, products/cash-intelligence/architecture/api-contract.md).
# Contract between the CI micro-frontend and ci-service's `api` unit. Approved by the architecture owner as part of the design baseline
# (DEC-016, 2026-11-20). Changes are made here first (GOV-CI-004), then in code.
# Extensions used on every operation:
#   x-ci-roles         CI roles that may call it (§11); every other role gets 403. Scope is applied server-side.
#   x-ci-requirements  the REQ-CI-* rows the operation serves
#   x-ci-reads         the design sections and tables it reads or writes
#   x-pii              on every string field (Crossroads Contract 17): true for personal data; institutionId is
#                      bound from the token, not an operation parameter (§16 Q64)
info:
  title: Cash Intelligence ci-service API
  version: 0.1.0
  summary: Backend-for-frontend API of Cash Intelligence (CI), read by the CI micro-frontend in the KBOP shell.
  description: |
    Conventions, the session and tenant seams, and the endpoint map are in design §2b
    (`products/cash-intelligence/architecture/api-contract.md`). In short:
    - Scope is never a client parameter. ci-service binds the session's user to the scope views (§11); a device or
      location outside the caller's scope answers 404, exactly like one that does not exist.
    - Money is a decimal string (USD, up to 4 decimals); counts are integers; business dates are `YYYY-MM-DD` in the
      branch's local business day; instants are UTC RFC 3339.
    - Current values carry `asOf` and `basis` (§4); figures computed from settings carry `configVersion` (§10.1).
    - Writes take an `Idempotency-Key` (stored as `request_key`); a retry with the same key returns the first result.
    - Errors are RFC 9457 problem details with a stable `code` and the request's `correlationId`.
    Synthetic data only in examples (GOV-CI-006).
servers:
  - url: '{baseUrl}/api/v1'
    description: The route from the KBOP shell to ci-service is open (§16 Q48); the base URL is a deployment setting.
    variables:
      baseUrl:
        default: https://ci.example.invalid
security:
  - kbopBearer: []
tags:
  - name: Session
  - name: Reference
  - name: Dashboard
  - name: Current Device Inventory
  - name: Historic EOD Inventory
  - name: ATM Cash Replenish History
  - name: ATM Usage
  - name: Cash Order Management
  - name: Overstock Analysis
  - name: Branch Cash Positioning
  - name: TCR Device Health
  - name: TCR Usage Health
  - name: Settings
  - name: User administration
  - name: Profile
  - name: Exports
  - name: Live updates

paths:
  # ---------------------------------------------------------------- Session and reference
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: The signed-in user's CI session (role, tenant, read-only flag)
      description: |
        Runs §11 token validation steps 1–5 (as on every call), then returns the session. A user with neither a CI
        role (`acc.user_role` row) nor the bootstrap user-administration capability (`acc.user_capability`) gets 403
        `no_ci_role`; a bootstrap user administrator gets a session with `ciRole` null and `canAdministerUsers` true.
        A partner user who has not selected a tenant gets 409
        `tenant_selection_required`.
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-ROLE-001, REQ-CI-ROLE-002, REQ-CI-ROLE-003]
      x-ci-reads: ['§11 token validation', acc.app_user, acc.user_role, ci_catalog.tenant]
      parameters: [{ $ref: '#/components/parameters/TenantSelect' }]
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /session/tenants:
    get:
      tags: [Session]
      operationId: listSelectableTenants
      summary: Tenants a partner user may select (one per session, §16 Q22)
      description: |
        Partner users only: the tenants granted to the user's partner in `ci_catalog.service_provider_tenant`. The
        chosen tenant is sent as `CI-Tenant` on every later request; it selects among these and never widens them.
        FI users get their own tenant only; an FI user who sends `CI-Tenant` is refused (403 `tenant_not_granted`),
        as on every other call. A granted tenant whose database cannot be reached is left out of the list.
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-ROLE-003]
      x-ci-reads: ['§11 step 3', ci_catalog.service_provider_tenant]
      responses:
        '200':
          description: Selectable tenants
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/TenantRef' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /locations:
    get:
      tags: [Reference]
      operationId: listLocations
      summary: Locations in the caller's scope, for breadcrumb pickers and labels
      description: Regions, branches and sites with their ancestors and device counts by type (count chips).
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-CDI-002, REQ-CI-COM-002, REQ-CI-TDH-002, REQ-CI-TUH-001]
      x-ci-reads: [acc.v_user_location_scope, ref.location]
      parameters: [{ $ref: '#/components/parameters/TenantSelect' }]
      responses:
        '200':
          description: Location tree
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /catalog/{catalog}:
    get:
      tags: [Reference]
      operationId: getCatalog
      summary: Global catalogues (device models, device types, denominations, error codes, forecast models)
      description: Readable by every role, Service Providers included; they hold no tenant data (§11).
      x-ci-roles: [admin, user, service_provider]
      x-ci-reads: [ref.device_model, ref.device_type, ref.denomination, ref.error_code, fcst.model]
      parameters:
        - name: catalog
          in: path
          required: true
          schema: { type: string, enum: [device-models, device-types, denominations, error-codes, forecast-models], x-pii: false }
      responses:
        '200':
          description: Catalogue rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ---------------------------------------------------------------- Dashboard
  /dashboard/widgets/{widget}:
    get:
      tags: [Dashboard]
      operationId: getDashboardWidget
      summary: One dashboard widget (the page calls the seven in parallel, §15 rule 3)
      description: |
        Widget totals and top-3 lists, computed at request time from the same sources as the detail page (§3.2).
        Thresholds come from the active configuration version (§10.1).
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-DASH-001, REQ-CI-DASH-002, REQ-CI-DASH-003, REQ-CI-DASH-004, REQ-CI-DASH-005,
                          REQ-CI-DASH-006, REQ-CI-DASH-007, REQ-CI-DASH-008, REQ-CI-DASH-009]
      x-ci-reads: ['§3.2 How the pages are served', cash.location_daily_activity]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: widget
          in: path
          required: true
          schema:
            type: string
            x-pii: false
            enum: [current-inventory, historical-eod, replenish-history, cash-orders, overstock, tcr-health, device-usage]
      responses:
        '200':
          description: Widget content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardWidget' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Current Device Inventory
  /inventory/summary:
    get:
      tags: [Current Device Inventory]
      operationId: getInventorySummary
      summary: Summary cards (total devices, total cash in fleet)
      description: |
        Whether the cards follow the Device Type filter is open (OQ-016); the response echoes the filters it applied
        (`appliedFilters`) so the page can label the cards.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-CDI-001, REQ-CI-CDI-005]
      x-ci-reads: ['§7.1', cash.device_inventory_current, cash.v_device_rollup]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                required: [totalDevices, totalCash, asOf, appliedFilters]
                properties:
                  totalDevices: { type: integer }
                  totalCash: { $ref: '#/components/schemas/Money' }
                  asOf: { $ref: '#/components/schemas/AsOf' }
                  appliedFilters: { $ref: '#/components/schemas/AppliedFilters' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inventory/items:
    get:
      tags: [Current Device Inventory]
      operationId: listInventoryItems
      summary: Items of the current drill level (regions, branches/sites or devices) with their cash
      description: |
        Coin dispensers are rolled into their linked TCR ("(+ coins)"); an unlinked coin dispenser's cash appears as
        an "Unlinked coin" line of its branch, flagged (§7.3a, REQ-CI-CDI-007). ATM values are the last approved EOD
        (`basis = last_eod`). The device level does not drill further. Sortable fields - name, cash; default `name`
        (the requirements name no sort for this list).
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-CDI-002, REQ-CI-CDI-005, REQ-CI-CDI-006, REQ-CI-CDI-007]
      x-ci-reads: [cash.device_inventory_current, cash.v_device_rollup, ref.device_link]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/Level' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inventory/denominations:
    get:
      tags: [Current Device Inventory]
      operationId: getInventoryDenominations
      summary: Denomination breakdown of the current level (chart and tooltip)
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-CDI-003, REQ-CI-CDI-004]
      x-ci-reads: [cash.device_inventory_current_line]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
      responses:
        '200':
          description: Breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DenominationBreakdown' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Historic EOD Inventory
  /eod/trend:
    get:
      tags: [Historic EOD Inventory]
      operationId: getEodTrend
      summary: EOD trend per day for the current level and period
      description: |
        Region and branch levels read the location rollups; the device level reads snapshots through
        `v_device_rollup` (coin merged into its TCR). Days on which not every device reported are marked
        (`reportingDevices < devices`).
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-HEOD-001, REQ-CI-HEOD-002, REQ-CI-HEOD-003, REQ-CI-HEOD-004, REQ-CI-HEOD-008]
      x-ci-reads: ['§7.2', '§7.3a', cash.location_daily_activity, cash.location_daily_denom, cash.inventory_snapshot]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/Level' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Trend
          content:
            application/json:
              schema:
                type: object
                required: [series]
                properties:
                  series:
                    description: One line per region, branch or device of the current drill level (REQ-CI-HEOD-001 criterion 2).
                    type: array
                    items:
                      type: object
                      required: [points]
                      # each line names what it is for: a region or branch (location) or a device
                      anyOf:
                        - required: [location]
                        - required: [device]
                      properties:
                        location: { $ref: '#/components/schemas/LocationRef' }
                        device: { $ref: '#/components/schemas/DeviceRef' }
                        points:
                          type: array
                          items:
                            type: object
                            required: [date, total, devices, reportingDevices]
                            properties:
                              date: { type: string, format: date, x-pii: false }
                              total: { $ref: '#/components/schemas/Money' }
                              devices: { type: integer }
                              reportingDevices: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /eod/denominations:
    get:
      tags: [Historic EOD Inventory]
      operationId: getEodDenominations
      summary: Denomination breakdown table for the current level and period
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-HEOD-005]
      x-ci-reads: [cash.inventory_snapshot_line, cash.location_daily_denom]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/Level' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Breakdown by date
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      required: [date, breakdown]
                      properties:
                        date: { type: string, format: date, x-pii: false }
                        breakdown: { $ref: '#/components/schemas/DenominationBreakdown' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /eod/export:
    get:
      tags: [Historic EOD Inventory, Exports]
      operationId: exportEodCsv
      summary: End of Day totals CSV (or the printable audit report data)
      description: |
        `format=csv`: one row per date and device (coin merged into its linked TCR), denomination columns
        $100…$0.01 (REQ-CI-HEOD-006). `format=audit-report`: the rows of the printable, branded report without
        denomination columns (REQ-CI-HEOD-007); the micro-frontend renders and prints it. Both stream and are logged by
        an export audit row (`audit.audit_log`, action `export`) with scope and period. File naming is open (OQ-001); the server sets Content-Disposition.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-HEOD-006, REQ-CI-HEOD-007, REQ-CI-HEOD-008]
      x-ci-reads: ['§15 rule 4', cash.inventory_snapshot, cash.v_device_rollup, audit.audit_log]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, audit-report], x-pii: false }
      responses:
        '200': { $ref: '#/components/responses/Export' }
        '202': { $ref: '#/components/responses/ExportQueued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- ATM Cash Replenish History
  /replenish-history/summary:
    get:
      tags: [ATM Cash Replenish History]
      operationId: getReplenishSummary
      summary: Summary cards (orders, scheduled, unscheduled, unscheduled cost)
      description: Orders are classified against the device's replenish schedule (§7.4); rejected and superseded orders are excluded.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-ARH-001, REQ-CI-ARH-002, REQ-CI-ARH-003, REQ-CI-ARH-008]
      x-ci-reads: ['§7.4', cash.v_cash_order_classified, cfg.schedule_calendar]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                required: [flaggedAtms, atms, totalOrders, scheduled, unscheduled, unscheduledCost, configVersion]
                properties:
                  flaggedAtms: { type: integer, description: ATMs over the unscheduled order threshold (REQ-CI-ARH-003 card 1). }
                  atms: { type: integer, description: 'ATMs in scope: the "across X ATMs" figure of card 2.' }
                  totalOrders: { type: integer }
                  scheduled: { type: integer }
                  unscheduled: { type: integer }
                  unscheduledCost: { $ref: '#/components/schemas/Money' }
                  configVersion: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /replenish-history/chart:
    get:
      tags: [ATM Cash Replenish History]
      operationId: getReplenishChart
      summary: Replenishments vs cash orders per day, with the planned series from schedule lines
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-ARH-004]
      x-ci-reads: [cash.replenishment, cash.v_cash_order_classified, cfg.schedule_calendar]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /replenish-history/flagged:
    get:
      tags: [ATM Cash Replenish History]
      operationId: listFlaggedAtms
      summary: ATMs whose unscheduled orders exceed the threshold
      description: Default sort `-unscheduled` (REQ-CI-ARH-006). Sortable fields - atm, branch, region, totalOrders, scheduled, unscheduled.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-ARH-005, REQ-CI-ARH-006, REQ-CI-ARH-007]
      x-ci-reads: [cash.v_cash_order_classified]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Flagged ATMs
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items, configVersion]
                    properties:
                      configVersion: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          required: [device, region, scheduleName, scheduledDay, totalOrders, scheduled, unscheduled]
                          properties:
                            device: { $ref: '#/components/schemas/DeviceRef' }
                            region: { $ref: '#/components/schemas/LocationRef' }
                            scheduleName: { type: [string, 'null'], description: The replenish schedule the ATM is assigned to (REQ-CI-ARH-005 Scheduled Day column); null when none., x-pii: false }
                            scheduledDay: { type: [string, 'null'], description: The schedule's day or cadence as shown in the column; null when none., x-pii: false }
                            totalOrders: { type: integer }
                            scheduled: { type: integer }
                            unscheduled: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- ATM Usage
  /atm-usage/heatmap:
    get:
      tags: [ATM Usage]
      operationId: getAtmUsageHeatmap
      summary: Geographic heat map of ATM activity for the current level and period
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-AUSE-001, REQ-CI-AUSE-002, REQ-CI-AUSE-003]
      x-ci-reads: [cash.location_daily_activity, ref.location]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/Level' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Buckets per location
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [location, deposits, dispenses]
                      properties:
                        location: { $ref: '#/components/schemas/LocationRef' }
                        latitude: { type: [number, 'null'] }
                        longitude: { type: [number, 'null'] }
                        deposits: { $ref: '#/components/schemas/Money' }
                        dispenses: { $ref: '#/components/schemas/Money' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /atm-usage/trend:
    get:
      tags: [ATM Usage]
      operationId: getAtmUsageTrend
      summary: Daily deposits and dispenses (line chart); with `date`, the per-item breakdown for that day
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-AUSE-004, REQ-CI-AUSE-005]
      x-ci-reads: [cash.location_daily_activity, cash.device_daily_activity]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/Level' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: date
          in: query
          description: One day of the period; returns the breakdown per region, branch or device at the current level.
          schema: { type: string, format: date, x-pii: false }
      responses:
        '200':
          description: Series, or breakdown for one date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
