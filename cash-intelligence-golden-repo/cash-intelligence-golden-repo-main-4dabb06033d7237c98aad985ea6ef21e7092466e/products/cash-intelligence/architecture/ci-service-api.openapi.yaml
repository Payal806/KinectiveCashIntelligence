  # ---------------------------------------------------------------- Cash Order Management
  /cash-orders/summary:
    get:
      tags: [Cash Order Management]
      operationId: getCashOrderSummary
      summary: Summary cards (devices emptying soon, branches low, acceptors filling)
      description: |
        Days until empty from the materialized projection (§9.4). ATM acceptor fill has no source in CO (§16 Q16);
        ATM `daysUntilFull` is null until that is answered.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-COM-001, REQ-CI-COM-002]
      x-ci-reads: ['§9.4', cash.device_projection]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                required: [devicesAtRisk, totalDevices, critical, acceptorsFillingSoon, configVersion]
                properties:
                  devicesAtRisk: { type: integer, description: Unique flagged devices in scope (REQ-CI-COM-001 card 1). }
                  totalDevices: { type: integer, description: 'All ATM and TCR devices in scope: the "out of" figure of card 1.' }
                  critical: { type: integer, description: Devices projected empty within 3 days (card 2). }
                  acceptorsFillingSoon:
                    type: [integer, 'null']
                    description: ATMs projected to fill within the days-until-full threshold (card 3); null in R1, which has no acceptor fill source (§16 Q16).
                  configVersion: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cash-orders/levels/{panel}:
    get:
      tags: [Cash Order Management]
      operationId: listCashLevels
      summary: Cash level status panels (ATM cash, branch cash, ATM bill acceptor)
      description: |
        Sortable fields per panel - `atm-cash`: device, branch, cash, daysUntilEmpty, nextScheduledOrder;
        `branch-cash`: device, type, branch, cash, daysUntilEmpty; `atm-acceptor`: device, region, branch, notes,
        daysUntilFull. Default: the most urgent first (`daysUntilEmpty`, or `daysUntilFull` for the acceptor panel);
        the requirements name no default, so this one is proposed.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-COM-003, REQ-CI-COM-004, REQ-CI-COM-005]
      x-ci-reads: [cash.device_projection, cash.device_inventory_current]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: panel
          in: path
          required: true
          schema: { type: string, enum: [atm-cash, branch-cash, atm-acceptor], x-pii: false }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items, configVersion]
                    properties:
                      configVersion: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CashLevelRow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cash-orders/recommendations:
    post:
      tags: [Cash Order Management]
      operationId: createOrderRecommendation
      summary: Compute an order recommendation for selected branches and period (not stored, §16 Q12)
      description: |
        Per device max(0, predicted usage over the period − current dispensable inventory); branch vault funds
        available = max(0, entered vault total − effective vault-minimum rule), deducted with device orders scaled
        down proportionally; the denomination split follows `split_basis` (§9.3). The entered vault totals are stored
        by ci-service's scoped write (§10.4, §11), so the request needs an `Idempotency-Key`. Only branches with forecasts
        can be selected (REQ-CI-COM-006). Days beyond the forecast horizon (ATM 40, TCR 60) are refused with the reason.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-COM-006, REQ-CI-COM-007]
      x-ci-reads: ['§9.3', '§10.4', '§9.1 current forecast', fcst.device_forecast_denom_current, ops.vault_balance_entry]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRecommendationRequest' }
      responses:
        '200':
          description: Recommendation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderRecommendation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /cash-orders/recommendations/export:
    post:
      tags: [Cash Order Management, Exports]
      operationId: exportOrderRecommendationCsv
      summary: Order estimate CSV for the same request (recomputed, not stored)
      description: Per-device rows, a TOTAL row, and scope/period metadata (REQ-CI-COM-008). Logged as an export audit row (`audit.audit_log`).
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-COM-008]
      x-ci-reads: ['§9.3', audit.audit_log]
      parameters: [{ $ref: '#/components/parameters/TenantSelect' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRecommendationRequest' }
      responses:
        '200': { $ref: '#/components/responses/Export' }
        '202': { $ref: '#/components/responses/ExportQueued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- Overstock Analysis
  /overstock/summary:
    get:
      tags: [Overstock Analysis]
      operationId: getOverstockSummary
      summary: Summary metrics, including the annual cost of excess cash for the given rates
      description: |
        Device-level daily SOD and dispensed facts only, never rollups; coin dispensers excluded; incomplete
        device-days excluded and counted (`incompleteDays`). The rates default to the settings `cost_of_funds_pct` and
        `insurance_pct`. Whether `overstock_lookback_days` or the page period drives the flag is open (§16 Q40).
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-OSA-001, REQ-CI-OSA-002, REQ-CI-OSA-003]
      x-ci-reads: ['§7.3', cash.device_daily_activity, cash.inventory_snapshot]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: costOfFundsPct
          in: query
          schema: { type: number, minimum: 0, multipleOf: 0.25 }
        - name: insurancePct
          in: query
          schema: { type: number, minimum: 0, multipleOf: 0.25 }
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                required: [overstockedDevices, excessCash, annualCostOfExcessCash, incompleteDays, configVersion]
                properties:
                  overstockedDevices: { type: integer }
                  excessCash: { $ref: '#/components/schemas/Money' }
                  annualCostOfExcessCash: { $ref: '#/components/schemas/Money' }
                  incompleteDays: { type: integer }
                  configVersion: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /overstock/chart:
    get:
      tags: [Overstock Analysis]
      operationId: getOverstockChart
      summary: SOD vs dispensed per day for the current scope
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-OSA-004]
      x-ci-reads: [cash.device_daily_activity, cash.inventory_snapshot]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /overstock/flagged:
    get:
      tags: [Overstock Analysis]
      operationId: listOverstockedDevices
      summary: Flagged devices table
      description: |
        All columns sortable (REQ-CI-OSA-005) - device, type, region, branch, daysDispenseExceeded, daysAnalyzed, avgDiscrepancy,
        lowestDiscrepancy, highestDiscrepancy; default `-avgDiscrepancy`.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-OSA-005]
      x-ci-reads: [cash.device_daily_activity, cfg.rule_assignment]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/DeviceType' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Flagged devices
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items, configVersion]
                    properties:
                      configVersion: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          required: [device, daysDispenseExceeded, daysAnalyzed, avgDiscrepancy, lowestDiscrepancy, highestDiscrepancy]
                          properties:
                            device: { $ref: '#/components/schemas/DeviceRef' }
                            daysDispenseExceeded: { type: integer }
                            daysAnalyzed: { type: integer }
                            avgDiscrepancy: { $ref: '#/components/schemas/Money' }
                            lowestDiscrepancy: { $ref: '#/components/schemas/Money' }
                            highestDiscrepancy: { $ref: '#/components/schemas/Money' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

