        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /branch-positioning/branches/{locationId}:
    get:
      tags: [Branch Cash Positioning]
      operationId: getBranchPositioning
      summary: Per-device positioning in one branch and the rebalancing recommendation
      description: Rebalance moves keep each device above `rebalance_min_working_balance` toward `branch_rebalance_target_days`.
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-BCP-005, REQ-CI-BCP-006]
      x-ci-reads: [cash.device_daily_activity, cash.device_projection, cfg.rule_assignment]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/PathLocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Devices and moves
          content:
            application/json:
              schema:
                type: object
                required: [devices, moves, configVersion]
                properties:
                  configVersion: { type: integer }
                  devices:
                    type: array
                    items:
                      type: object
                      required: [device, cash, sharePct, lowShare, avgOverstockedBy, avgDailyUsage]
                      properties:
                        device: { $ref: '#/components/schemas/DeviceRef' }
                        cash: { $ref: '#/components/schemas/Money' }
                        sharePct: { type: number }
                        lowShare: { type: boolean, description: Below the branch's average share (REQ-CI-BCP-005 criterion 2). }
                        avgOverstockedBy: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Average amount over the acceptable level across the interval; null when not overstocked. }
                        avgDailyUsage: { $ref: '#/components/schemas/Money' }
                  moves:
                    type: array
                    items:
                      type: object
                      required: [fromDevice, toDevice, amount]
                      properties:
                        fromDevice: { $ref: '#/components/schemas/DeviceRef' }
                        toDevice: { $ref: '#/components/schemas/DeviceRef' }
                        amount: { $ref: '#/components/schemas/Money' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- TCR Device Health
  /tcr-health/summary:
    get:
      tags: [TCR Device Health]
      operationId: getTcrHealthSummary
      summary: Tab counts (device down, preventative maintenance, proactive service), TCRs only
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TDH-001, REQ-CI-ROLE-003, REQ-CI-ROLE-004]
      x-ci-reads: ['§8', '§10.3', health.downtime_episode, ops.device_rule_state]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [deviceDown, preventative, proactive, configVersion]
                properties:
                  deviceDown: { type: integer }
                  preventative: { type: integer }
                  proactive: { type: integer }
                  configVersion: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tcr-health/flagged:
    get:
      tags: [TCR Device Health]
      operationId: listTcrHealthFlagged
      summary: Flagged TCRs for one tab
      description: |
        Device down lists open, unacknowledged downtime episodes; the other tabs list open breaches of maintenance
        rules. Sortable fields (REQ-CI-TDH-004) - device, region, branch, value (the tab's value column: downtime,
        notes moved, or errors in 7 days); default `-value`.
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TDH-001, REQ-CI-TDH-002, REQ-CI-TDH-003, REQ-CI-TDH-004]
      x-ci-reads: [health.downtime_episode, ops.device_rule_state, ops.breach, ops.service_record]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: tab
          in: query
          required: true
          schema: { $ref: '#/components/schemas/MaintenanceType' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Flagged TCRs
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TcrHealthRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/{deviceId}/service-records:
    post:
      tags: [TCR Device Health]
      operationId: logServiceRecord
      summary: Log a service record for a device in scope
      description: |
        Written by ci-service's scoped write (device ∈ the caller's device scope, §11). A record clears every open
        flag of its type for the device (§10.3; whether it should clear every type is §16 Q24) and enqueues rule
        evaluation and projection refresh in the same transaction. A frozen tenant is read-only (403 `tenant_read_only`).
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TDH-005]
      x-ci-reads: ['§10.3', ops.service_record]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/PathDeviceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRecordCreate' }
      responses:
        '201':
          description: Created (or the original record for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /service-records/{serviceRecordId}/attachments:
    post:
      tags: [TCR Device Health]
      operationId: addServiceRecordAttachment
      summary: Upload an attachment to a service record
      description: |
        A scoped write (the record's device ∈ device scope, §11). Allowed types PDF, DOC, DOCX, JPEG, PNG
        (§10.3; whether DOC stays accepted and the size limit are §16 Q59). The file goes to the tenant's bucket with
        malware scanning; `scanStatus` starts `pending`.
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TDH-005]
      x-ci-reads: ['§10.3', '§13', ops.service_record_attachment]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: serviceRecordId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  description: The file's raw bytes (no type, so the part is binary, not text).
            encoding:
              file:
                contentType: application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/jpeg, image/png
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedType' }

  # ---------------------------------------------------------------- TCR Usage Health
  /tcr-usage/quadrants:
    get:
      tags: [TCR Usage Health]
      operationId: getTcrUsageQuadrants
      summary: Uptime vs utilization gauge (counts per quadrant), TCRs only
      description: Uptime is clipped to branch business hours and shown as n/a without hours (§8; business-hours vs wall-clock and the 97% cutoff are §16 Q19).
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TUH-001, REQ-CI-TUH-002]
      x-ci-reads: ['§8', cash.device_daily_activity, health.downtime_episode, ref.location_hours]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Quadrant counts
          content:
            application/json:
              schema:
                type: object
                required: [quadrants, configVersion]
                properties:
                  configVersion: { type: integer }
                  quadrants:
                    type: array
                    items:
                      type: object
                      required: [quadrant, devices]
                      properties:
                        quadrant: { $ref: '#/components/schemas/Quadrant' }
                        devices: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tcr-usage/devices:
    get:
      tags: [TCR Usage Health]
      operationId: listTcrUsageDevices
      summary: Quadrant detail table
      description: |
        All columns sortable (REQ-CI-TUH-003) - device, branch, transactions, errors, uptimePct, downtimeMinutes,
        leftSideUsagePct, rightSideUsagePct, accessUsagePct; default `-transactions`. `imbalanced` when left/right usage
        differ by more than `side_imbalance_pct`.
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TUH-003]
      x-ci-reads: [cash.device_daily_activity, health.device_error_event]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: quadrant
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Quadrant' }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TcrUsageRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/{deviceId}/errors:
    get:
      tags: [TCR Usage Health]
      operationId: listDeviceErrors
      summary: Error details dialog for one device and period
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TUH-004]
      x-ci-reads: [health.device_error_event, ref.error_code]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/PathDeviceId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Errors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [occurredAt, errorCode, severity, downtimeMinutes]
                      properties:
                        occurredAt: { type: string, format: date-time, x-pii: false }
                        errorCode: { type: string, x-pii: false }
                        downtimeMinutes: { type: [integer, 'null'], description: Per-occurrence downtime from the matching episode (REQ-CI-TUH-004); null when there is none. }
                        description: { type: [string, 'null'], x-pii: false }
                        severity: { type: [string, 'null'], x-pii: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tcr-usage/export:
    get:
      tags: [TCR Usage Health, Exports]
      operationId: exportTcrUsage
      summary: TCR deposit-dispense CSV (`report=transactions`) or the TCR-TCD usage report CSV (`report=usage`)
      x-ci-roles: [admin, user, service_provider]
      x-ci-requirements: [REQ-CI-TUH-005, REQ-CI-TUH-006]
      x-ci-reads: ['§15 rule 4', cash.device_daily_activity_denom, health.device_error_event, audit.audit_log]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: report
          in: query
          required: true
          schema: { type: string, enum: [transactions, usage], x-pii: false }
        - { $ref: '#/components/parameters/LocationId' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200': { $ref: '#/components/responses/Export' }
        '202': { $ref: '#/components/responses/ExportQueued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Settings (Admin only)
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: The tenant's active configuration (scalar settings and rule parameters) with ranges and defaults
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-001, REQ-CI-SET-004, REQ-CI-SET-006, REQ-CI-SET-009, REQ-CI-ROLE-001, REQ-CI-ROLE-002]
      x-ci-reads: ['§10.1', 'Platform Config Service (Config Client)']
      parameters: [{ $ref: '#/components/parameters/TenantSelect' }]
      responses:
        '200':
          description: Active configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: activateSettings
      summary: Activate a new configuration version (no approval step in R1, §16 Q35)
      description: |
        ci-service checks `ci_role = admin`, writes the candidate through the Config Client with the acting user as
        actor, activates it, writes `audit_log` with before/after values, and enqueues projection refresh and rule
        evaluation. `baseVersion` must equal the active version (409 `config_version_conflict` otherwise). Values
        outside a published range are refused (422); most ranges are open (§16 Q47).
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-001, REQ-CI-SET-004, REQ-CI-SET-006, REQ-CI-SET-009]
      x-ci-reads: ['§10.1', '§11 Settings writes', audit.audit_log]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigurationCandidate' }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /settings/preview:
    post:
      tags: [Settings]
      operationId: previewSettings
      summary: Preview a candidate configuration against current data without activating it (Contract 9)
      description: |
        Reports what would change, for example how many devices a new threshold would flag. Where the preview
        evaluator runs (in ci-service, or called by the Platform Config Service) is open (§16 Q35).
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-001, REQ-CI-SET-004, REQ-CI-SET-006, REQ-CI-SET-009]
      x-ci-reads: ['§10.1 preview evaluator']
      parameters: [{ $ref: '#/components/parameters/TenantSelect' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigurationCandidate' }
      responses:
        '200':
          description: Effects of the candidate
          content:
            application/json:
              schema:
                type: object
                required: [effects]
                properties:
                  effects:
                    type: array
                    items:
                      type: object
                      required: [key, currentlyFlagged, wouldBeFlagged]
                      properties:
                        key: { type: string, x-pii: false }
                        currentlyFlagged: { type: integer }
                        wouldBeFlagged: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rules:
    get:
      tags: [Settings]
      operationId: listRules
      summary: Rules of one type with parameters, assignment counts and recipients
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-002, REQ-CI-SET-003, REQ-CI-SET-005, REQ-CI-SET-007, REQ-CI-SET-008]
      x-ci-reads: ['§10.2', cfg.rule, cfg.rule_assignment, cfg.rule_alert_recipient]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RuleType' }
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Settings]
      operationId: createRule
      summary: Create a rule (one rule, two stores, one write, §10.2)
      description: |
        Allocates `rule_id` in `cfg.rule` (inactive), writes the parameters into a new configuration version, activates
        it, then sets `is_active`. Audited with before/after JSON.
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-002, REQ-CI-SET-003, REQ-CI-SET-005, REQ-CI-SET-007, REQ-CI-SET-008]
      x-ci-reads: ['§10.2', cfg.rule]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rules/{ruleId}:
    parameters:
      - { $ref: '#/components/parameters/TenantSelect' }
      - name: ruleId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Settings]
      operationId: getRule
      summary: One rule with its parameters, assignments, recipients and schedule
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-002, REQ-CI-SET-003, REQ-CI-SET-005, REQ-CI-SET-007, REQ-CI-SET-008]
      x-ci-reads: ['§10.2']
      responses:
        '200':
          description: Rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Settings]
      operationId: updateRule
      summary: Edit a rule's name, parameters, alert settings, recipients or schedule
      description: Parameter changes go through a new configuration version; `baseVersion` guards against concurrent edits.
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-002, REQ-CI-SET-003, REQ-CI-SET-005, REQ-CI-SET-007, REQ-CI-SET-008]
      x-ci-reads: ['§10.2', cfg.rule, cfg.rule_alert_recipient, cfg.rule_replenish_schedule]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Settings]
      operationId: deleteRule
      summary: Delete a rule
      description: A rule with breach history is deactivated (logical delete, its breaches keep their rule); one without is removed with its state, assignments, recipients and schedule (§10.3).
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-002, REQ-CI-SET-003, REQ-CI-SET-005, REQ-CI-SET-007, REQ-CI-SET-008]
      x-ci-reads: ['§10.2']
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Deleted or deactivated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rules/{ruleId}/assignments:
    put:
      tags: [Settings]
      operationId: setRuleAssignments
      summary: Replace a rule's device or location assignments
      description: |
        Exclusive types (acceptable discrepancy, vault minimum, replenish schedule) allow one active rule per target;
        a target already held by another rule fails with 409 `exclusive_assignment` naming the holder, so the page can
        explain why (§10.2). Vault-minimum rules target locations; the others target devices.
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-002, REQ-CI-SET-003, REQ-CI-SET-005, REQ-CI-SET-007, REQ-CI-SET-008]
      x-ci-reads: ['§10.2', cfg.rule_assignment]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: ruleId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  items: { $ref: '#/components/schemas/RuleTarget' }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items: { $ref: '#/components/schemas/RuleTarget' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rules/{ruleId}/default:
    put:
      tags: [Settings]
      operationId: setTenantDefaultRule
      summary: Make a rule its type's tenant default (exclusive types only; one active default per type)
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-SET-005, REQ-CI-SET-007, REQ-CI-SET-008]
      x-ci-reads: ['§10.2', cfg.rule]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: ruleId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Set }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- User administration
  /users:
    get:
      tags: [User administration]
      operationId: listUsers
      summary: CI users of the tenant with role, location access and enterprise access
      description: |
        Admins, and KBOP `FIUser_UserAdmin` users of their own FI through the bootstrap rule, which covers roles and
        location access only (§11).
      x-ci-roles: [admin, bootstrap_user_admin]
      x-ci-requirements: [REQ-CI-ROLE-001]
      x-ci-reads: ['§11', acc.app_user, acc.user_role, acc.user_location_access]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageInfo' }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CiUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{userId}/access:
    put:
      tags: [User administration]
      operationId: setUserAccess
      summary: Set a user's CI role and branch/site access (versioned and audited)
      description: |
        Writes `acc.user_role` and `acc.user_location_access` through ci-service's admin writes; no role row means no
        access. Enterprise access is Admin-only (OQ-007 asks what it means); the bootstrap user admin may set role and
        locations only.
      x-ci-roles: [admin, bootstrap_user_admin]
      x-ci-requirements: [REQ-CI-ROLE-001, REQ-CI-ROLE-002]
      x-ci-reads: ['§11', acc.user_role, acc.user_location_access, audit.audit_log]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAccessWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CiUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Refused with `last_admin`, removing or demoting the tenant's last administrator (§11).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /service-providers/{providerId}/models:
    get:
      tags: [User administration]
      operationId: getServicedModels
      summary: Device models a service provider services in this tenant
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-ROLE-004]
      x-ci-reads: ['§11', acc.service_provider_model]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: providerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicedModels' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [User administration]
      operationId: setServicedModels
      summary: Replace the serviced models (CI is the master in R1; which host system should provide them is OQ-002)
      x-ci-roles: [admin]
      x-ci-requirements: [REQ-CI-ROLE-004]
      x-ci-reads: ['§11 interim ownership', acc.service_provider_model, audit.audit_log]
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: providerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicedModels' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicedModels' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Profile
  /profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: The signed-in user's own account details (read-only)
      description: |
        Looked up by the session's KBOP user id, not by email (email is an attribute, never a key, §11). `phone` is a
        CI-owned optional field (§16 Q25). Service Providers reach only the two TCR/TCD pages (REQ-CI-ROLE-003).
      x-ci-roles: [admin, user]
      x-ci-requirements: [REQ-CI-PROF-001]
      x-ci-reads: [acc.app_user, acc.user_role, acc.user_location_access]
      parameters: [{ $ref: '#/components/parameters/TenantSelect' }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Exports (large, background)
  /exports/{exportId}:
    get:
      tags: [Exports]
      operationId: getExportJob
      summary: Status of a background export; when done, a short-lived download link
      description: |
        Very large exports run as background jobs under the requesting user's scope and write a file to the tenant's
        bucket (§15 rule 4); only the requesting user can read the job. File retention needs Legal review.
      x-ci-roles: [admin, user, service_provider]
      x-ci-reads: ['§15 rule 4']
      parameters:
        - { $ref: '#/components/parameters/TenantSelect' }
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid, x-pii: false }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Live updates
  /events:
    get:
      tags: [Live updates]
      operationId: streamEvents
      summary: Server-sent events telling the page that data in its scope changed
      description: |
        After each feed run (and service record, configuration change) ci-service notifies sessions whose scope
        contains a touched device (§4, §14.2 change signal). An event carries no data: the page re-reads through its
        scoped endpoints. A page reconnecting to another replica re-reads. Browsers' EventSource cannot send request
        headers, so the page reads the stream with fetch (the template's `useEventStream`), sending the bearer token
        and, for partner users, `CI-Tenant`.
        Filtering notifications by scope is access control: Legal review with §11.
      x-ci-roles: [admin, user, service_provider]
      x-ci-reads: ['§4 Change notifications', '§14.2 Change signal']
      parameters: [{ $ref: '#/components/parameters/TenantSelect' }]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              itemSchema:
                type: object
                required: [event, data]
                properties:
                  event: { type: string, enum: [data-changed, config-changed, session-ending], x-pii: false }
                  data:
                    type: string
                    x-pii: false
                    description: JSON with the change kind and the run time only; never device or cash data.
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    kbopBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The shell's Auth0 access token, sent with every call; there is no server-side session (the Crossroads
        micro-frontend template, DEC-021). Validated by §11 steps 1–5: the template's server library checks signature,
        issuers, audience and expiry; CI's layer requires `exp` and runs steps 2–5. The audience is §16 Q48.

  parameters:
    TenantSelect:
      name: CI-Tenant
      in: header
      description: |
        Partner users only: the tenant chosen from `GET /session/tenants` (one per session, §16 Q22). It selects among
        the tenants granted to the user's partner and never widens them; FI users omit it (their tenant comes from the
        token; an FI user who sends it gets 403 `tenant_not_granted`).
      schema: { type: string, x-pii: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, stored as `request_key` (unique per tenant); a retry with the same key writes once and
        returns the first result. The replay lookup runs after the session, role and scope checks (a caller who has
        lost access gets 401, 403 or 404, never a stored result) and before the configuration-version check, so a
        keyed retry of a write that succeeded returns its result, not 409 `config_version_conflict`.
      schema: { type: string, format: uuid, x-pii: false }
    Level:
      name: level
      in: query
      description: Drill level of the returned items. Default `region`; `branch` covers branches and sites; `device` does not drill further.
      schema: { type: string, enum: [region, branch, device], default: region, x-pii: false }
    LocationId:
      name: locationId
      in: query
      description: The parent location of the current drill level (a region or a branch/site); absent means all regions in scope.
      schema: { type: integer }
    PathLocationId:
      name: locationId
      in: path
      required: true
      schema: { type: integer }
    PathDeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: integer }
    DeviceType:
      name: deviceType
      in: query
      description: Device Type pill. Coin dispensers are never standalone; they roll into their linked TCR.
      schema: { type: string, enum: [both, atm, tcr], default: both, x-pii: false }
    From:
      name: from
      in: query
      required: true
      description: First business day of the period (inclusive). Presets and the default period are the page's (for example 30 or 90 days).
      schema: { type: string, format: date, x-pii: false }
    To:
      name: to
      in: query
      required: true
      description: Last business day of the period (inclusive).
      schema: { type: string, format: date, x-pii: false }
    Search:
      name: q
      in: query
      description: Case-insensitive name filter over devices, branches and regions at the current level.
      schema: { type: string, maxLength: 100, x-pii: false }
    Sort:
      name: sort
      in: query
      description: A sortable field of the table, `-field` for descending. Each operation names its fields and default.
      schema: { type: string, maxLength: 40, x-pii: false }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from the previous page's `nextCursor`.
      schema: { type: string, x-pii: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

  responses:
    BadRequest:
      description: Malformed request (bad date range, unknown sort field, …)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthenticated:
      description: Missing, expired or invalid session or token (§11 steps 1–2)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: |
        The caller's role may not call this operation (`role_not_permitted`), the user has no CI role (`no_ci_role`),
        an FI user sent `CI-Tenant` (`tenant_not_granted`), or the tenant is frozen and the call writes
        (`tenant_read_only`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Not found, or outside the caller's scope (the two are indistinguishable by design).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Exclusive assignment held by another rule, stale configuration version, or tenant selection required.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Valid shape but refused by a rule (a value outside its published range, a period past the forecast horizon, a branch without forecasts).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooLarge:
      description: Attachment larger than the limit (the limit is §16 Q59).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedType:
      description: Attachment type not allowed.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Export:
      description: |
        Streamed export. The server sets Content-Disposition (file naming is OQ-001). Logged as an export audit row (`audit.audit_log`)
        with scope and period. Staff free text (technician names, notes) is never exported (§13.1).
      headers:
        Content-Disposition:
          schema: { type: string, x-pii: false }
      content:
        text/csv:
          schema: { type: string, x-pii: false }
        application/json:
          schema:
            description: Audit report rows (`format=audit-report`), rendered and printed by the micro-frontend.
            type: object
            additionalProperties: true
    ExportQueued:
      description: The export is too large to stream and runs as a background job; poll `GET /exports/{exportId}`.
      headers:
        Location:
          schema: { type: string, x-pii: false }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExportJob' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference, x-pii: false }
        title: { type: string, x-pii: false }
        status: { type: integer }
        detail: { type: string, x-pii: false }
        code:
          type: string
          x-pii: false
          description: Stable machine-readable reason, for example `no_ci_role`, `role_not_permitted`, `tenant_not_granted`, `invalid_device_type`, `tenant_read_only`, `tenant_selection_required`, `exclusive_assignment`, `config_version_conflict`, `forecast_horizon`.
        correlationId: { type: string, x-pii: false }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string, x-pii: false }
              message: { type: string, x-pii: false }
    Money:
      type: string
      x-pii: false
      description: Decimal amount in USD with up to 4 decimals (DECIMAL(19,4)); the page formats it.
      pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
      examples: ['14880860.9000']
    AsOf:
      type: object
      description: Freshness of a current value (§4). ATMs show the last approved EOD (`last_eod`) with its time.
      required: [at, basis]
      properties:
        at: { type: string, format: date-time, x-pii: false }
        basis: { type: string, enum: [live, last_eod], x-pii: false }
    AppliedFilters:
      type: object
      properties:
        locationId: { type: [integer, 'null'] }
        deviceType: { type: string, enum: [both, atm, tcr], x-pii: false }
    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { type: [string, 'null'], x-pii: false }
        total: { type: [integer, 'null'], description: Count of matching items when cheap to compute; else null. }
    TenantRef:
      type: object
      required: [tenantRef, name, status]
      properties:
        tenantRef: { type: string, description: Opaque tenant selector for `CI-Tenant`., x-pii: false }
        name: { type: string, x-pii: false }
        status: { type: string, enum: [active, frozen], x-pii: false }
    Session:
      type: object
      required: [userId, ciRole, tenant, readOnly]
      properties:
        userId: { type: integer }
        displayName: { type: [string, 'null'], x-pii: true }
        ciRole: { type: [string, 'null'], enum: [admin, user, service_provider, null], x-pii: false, description: Null for a bootstrap user administrator with no CI role (§11). }
        canAdministerUsers: { type: boolean, description: Admin, or the bootstrap rule (KBOP FIUser_UserAdmin of this FI). }
        hasEnterpriseAccess: { type: boolean }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        readOnly: { type: boolean, description: True when the tenant is frozen. }
        configVersion: { type: integer }
    LocationRef:
      type: object
      required: [locationId, name, kind]
      properties:
        locationId: { type: integer }
        name: { type: string, x-pii: false }
        kind: { type: string, enum: [region, branch, site], x-pii: false }
    Location:
      allOf:
        - { $ref: '#/components/schemas/LocationRef' }
        - type: object
          properties:
            parentId: { type: [integer, 'null'] }
            deviceCounts:
              type: object
              properties:
                atm: { type: integer }
                tcr: { type: integer }
                tcd: { type: integer }
    DeviceRef:
      type: object
      required: [deviceId, name, type, branch]
      properties:
        deviceId: { type: integer }
        name: { type: string, x-pii: false }
        type: { type: string, enum: [atm, tcr, tcd], x-pii: false }
        model: { type: [string, 'null'], x-pii: false }
        branch: { $ref: '#/components/schemas/LocationRef' }
        region: { $ref: '#/components/schemas/LocationRef' }
    InventoryItem:
      type: object
      required: [kind, name, cash, asOf]
      properties:
        kind: { type: string, enum: [region, branch, site, device, unlinked_coin], x-pii: false }
        location: { $ref: '#/components/schemas/LocationRef' }
        device: { $ref: '#/components/schemas/DeviceRef' }
        name: { type: string, description: 'For a TCR with linked coin dispensers, the name carries "(+ coins)".', x-pii: false }
        cash: { $ref: '#/components/schemas/Money' }
        devices: { type: [integer, 'null'] }
        dataQualityFlag: { type: [string, 'null'], description: For example `unlinked_coin`., x-pii: false }
        asOf: { $ref: '#/components/schemas/AsOf' }
    DenominationBreakdown:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [denominationId, label, count, amount]
            properties:
              denominationId: { type: integer }
              label: { type: string, examples: ['$100'], x-pii: false }
              count: { type: [integer, 'null'], description: Null for unsorted rows (no counts). }
              amount: { $ref: '#/components/schemas/Money' }
    DailySeries:
      type: object
      required: [series]
      properties:
        date: { type: [string, 'null'], format: date, description: Set when the response is the breakdown of one day., x-pii: false }
        series:
          type: array
          items:
            type: object
            required: [name, points]
            properties:
              name: { type: string, description: 'For example replenishments, orders, planned, deposits, dispenses, sod, dispensed.', x-pii: false }
              item:
                $ref: '#/components/schemas/LocationRef'
                description: The region or branch/site a breakdown series belongs to (unset for device breakdowns).
              device:
                $ref: '#/components/schemas/DeviceRef'
                description: The device a breakdown series belongs to at the device level (unset otherwise).
              points:
                type: array
                items:
                  type: object
                  required: [date, value]
                  properties:
                    date: { type: string, format: date, x-pii: false }
                    value: { $ref: '#/components/schemas/Money' }
                    count: { type: [integer, 'null'] }
    UsageRank:
      type: object
      required: [device, value]
      properties:
        device: { $ref: '#/components/schemas/DeviceRef' }
        value: { type: string, description: Transaction count or amount, per `rankedBy`., x-pii: false }
    DashboardWidget:
      type: object
      required: [widget, configVersion]
      properties:
        widget: { type: string, x-pii: false }
        headline: { type: object, additionalProperties: true, description: The widget's totals (per REQ-CI-DASH-003…009). }
        top:
          type: array
          description: The widget's listed rows; three for most widgets, five for the Device Usage widget (REQ-CI-DASH-009).
          maxItems: 5
          items: { type: object, additionalProperties: true }
        asOf: { $ref: '#/components/schemas/AsOf' }
        configVersion: { type: integer }
    CashLevelRow:
      type: object
      required: [name, cash, asOf]
      properties:
        device: { $ref: '#/components/schemas/DeviceRef' }
        branch: { $ref: '#/components/schemas/LocationRef' }
        name: { type: string, x-pii: false }
        cash: { $ref: '#/components/schemas/Money' }
        daysUntilEmpty: { type: [number, 'null'] }
        daysUntilFull: { type: [number, 'null'], description: Null for ATMs until §16 Q16 is answered. }
        notes: { type: [integer, 'null'], description: 'Notes in the bill acceptor (acceptor panel, REQ-CI-COM-005).' }
        nextScheduledOrder:
          type: [object, 'null']
          description: The next scheduled order and its schedule (ATM cash panel, REQ-CI-COM-003).
          properties:
            date: { type: string, format: date, x-pii: false }
            scheduleName: { type: string, x-pii: false }
        flagged: { type: boolean }
        asOf: { $ref: '#/components/schemas/AsOf' }
    OrderRecommendationRequest:
      type: object
      required: [branches, from, to]
      properties:
        from: { type: string, format: date, x-pii: false }
        to: { type: string, format: date, x-pii: false }
        branches:
          type: array
          minItems: 1
          items:
            type: object
            required: [locationId, vaultTotal]
            properties:
              locationId: { type: integer }
              vaultTotal: { $ref: '#/components/schemas/Money' }
    OrderRecommendation:
      type: object
      required: [from, to, branches, forecastRunDate, configVersion]
      properties:
        from: { type: string, format: date, x-pii: false }
        to: { type: string, format: date, x-pii: false }
        forecastRunDate: { type: string, format: date, x-pii: false }
        configVersion: { type: integer, description: The configuration version the calculation used (vault-minimum rules, defaults). }
        branches:
          type: array
          items:
            type: object
            required: [branch, vaultTotal, vaultMinimum, vaultAvailable, devices]
            properties:
              branch: { $ref: '#/components/schemas/LocationRef' }
              vaultTotal: { $ref: '#/components/schemas/Money' }
              vaultMinimum: { $ref: '#/components/schemas/Money' }
              vaultAvailable: { $ref: '#/components/schemas/Money' }
              devices:
                type: array
                items:
                  type: object
                  required: [device, currentInventory, predictedUsage, grossNeed, order, coveredByVault, splitBasis, notes]
                  properties:
                    device: { $ref: '#/components/schemas/DeviceRef' }
                    currentInventory: { $ref: '#/components/schemas/Money' }
                    predictedUsage: { $ref: '#/components/schemas/Money' }
                    grossNeed: { $ref: '#/components/schemas/Money' }
                    order: { $ref: '#/components/schemas/Money' }
                    distributionPct: { type: number }
                    coveredByVault: { type: boolean }
                    splitBasis: { type: string, enum: [forecast, schedule, default], x-pii: false }
                    notes:
                      type: array
                      items:
                        type: object
                        required: [denominationId, count]
                        properties:
                          denominationId: { type: integer }
                          count: { type: integer, minimum: 0 }
    MaintenanceType:
      type: string
      x-pii: false
      enum: [device_down, preventative, proactive]
    TcrHealthRow:
      type: object
      required: [device]
      properties:
        device: { $ref: '#/components/schemas/DeviceRef' }
        downSince: { type: [string, 'null'], format: date-time, x-pii: false }
        downtimeMinutes: { type: [integer, 'null'] }
        notesMovedSinceService: { type: [integer, 'null'] }
        errors7d: { type: [integer, 'null'] }
        errors30d: { type: [integer, 'null'], description: Proactive tab only (REQ-CI-TDH-003). }
        lastServiceDate: { type: [string, 'null'], format: date, x-pii: false }
        lastServiceDateOnly: { type: boolean, description: True when the last service is a seeded date-only record (§10.3). }
    ServiceRecordCreate:
      type: object
      required: [maintenanceType, serviceDate]
      properties:
        maintenanceType: { $ref: '#/components/schemas/MaintenanceType' }
        serviceDate: { type: string, format: date, x-pii: false }
        technicianName: { type: [string, 'null'], maxLength: 100, x-pii: true }
        notes: { type: [string, 'null'], maxLength: 2000, x-pii: true }
    ServiceRecord:
      allOf:
        - { $ref: '#/components/schemas/ServiceRecordCreate' }
        - type: object
          required: [serviceRecordId, deviceId, createdAt]
          properties:
            serviceRecordId: { type: integer, format: int64 }
            deviceId: { type: integer }
            createdAt: { type: string, format: date-time, x-pii: false }
    Attachment:
      type: object
      required: [attachmentId, fileName, contentType, sizeBytes, scanStatus]
      properties:
        attachmentId: { type: integer, format: int64 }
        fileName: { type: string, x-pii: true }
        contentType:
          type: string
          x-pii: false
          enum: [application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/jpeg, image/png]
        sizeBytes: { type: integer }
        scanStatus: { type: string, enum: [pending, clean, rejected], x-pii: false }
    Quadrant:
      type: string
      x-pii: false
      enum: [high_uptime_high_use, high_uptime_low_use, low_uptime_high_use, low_uptime_low_use]
    TcrUsageRow:
      type: object
      required: [device, transactions, errors]
      properties:
        device: { $ref: '#/components/schemas/DeviceRef' }
        transactions: { type: integer }
        errors: { type: integer }
        uptimePct: { type: [number, 'null'], description: Null (n/a) without branch hours. }
        downtimeMinutes: { type: [integer, 'null'] }
        leftSideUsagePct: { type: [number, 'null'] }
        rightSideUsagePct: { type: [number, 'null'] }
        accessUsagePct: { type: [number, 'null'] }
        imbalanced: { type: boolean }
    Configuration:
      type: object
      required: [version, values, fields]
      properties:
        version: { type: integer }
        activatedAt: { type: string, format: date-time, x-pii: false }
        values: { type: object, additionalProperties: true, description: 'Setting key → value, per `schemas/config/product.v1.json`.' }
        fields:
          type: array
          items:
            type: object
            required: [key, type, default]
            properties:
              key: { type: string, x-pii: false }
              type: { type: string, x-pii: false }
              default: {}
              minimum: { type: [number, 'null'] }
              maximum: { type: [number, 'null'], description: Null where the range is still open (§16 Q47). }
              step: { type: [number, 'null'] }
    ConfigurationCandidate:
      type: object
      required: [baseVersion, values]
      properties:
        baseVersion: { type: integer }
        values: { type: object, additionalProperties: true }
    RuleType:
      type: string
      x-pii: false
      enum: [preventative_maintenance, proactive_service, acceptable_discrepancy, vault_minimum, replenish_schedule]
    RuleTarget:
      type: object
      required: [targetKind, targetId]
      properties:
        targetKind: { type: string, enum: [device, location], x-pii: false }
        targetId: { type: integer }
    RuleWrite:
      type: object
      required: [ruleType, name, baseVersion]
      properties:
        ruleType: { $ref: '#/components/schemas/RuleType' }
        name: { type: string, maxLength: 100, x-pii: false }
        baseVersion: { type: integer, description: Active configuration version the edit starts from. }
        isActive: { type: boolean }
        parameters: { type: object, additionalProperties: true, description: Per rule type (§10.2 rule parameters). }
        alert:
          type: object
          properties:
            cadence: { type: string, enum: [daily, weekly, biweekly, monthly], x-pii: false }
            alertLocalTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', x-pii: false }
            timezoneId: { type: [string, 'null'], x-pii: false }
            isEnabled: { type: boolean }
        recipients:
          type: array
          items: { type: string, format: email, x-pii: true }
        schedule:
          type: object
          description: Replenish schedules only.
          properties:
            frequency: { type: string, enum: [daily, weekly, biweekly, monthly], x-pii: false }
            daysOfWeek: { type: array, items: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat], x-pii: false } }
            anchorDate: { type: [string, 'null'], format: date, x-pii: false }
            lines:
              type: array
              items:
                type: object
                required: [denominationId, noteCount]
                properties:
                  denominationId: { type: integer }
                  noteCount: { type: integer, minimum: 0 }
    Rule:
      allOf:
        - { $ref: '#/components/schemas/RuleWrite' }
        - type: object
          required: [ruleId, isTenantDefault, targets, assignmentCount]
          properties:
            ruleId: { type: integer }
            targets:
              type: array
              description: The rule's current assignments; `PUT /rules/{ruleId}/assignments` replaces this whole list.
              items: { $ref: '#/components/schemas/RuleTarget' }
            isTenantDefault: { type: boolean }
            origin: { type: string, enum: [ci, seeded_cm, seeded_iq], x-pii: false }
            assignmentCount: { type: integer }
    CiUser:
      type: object
      required: [userId, ciRole]
      properties:
        userId: { type: integer }
        displayName: { type: [string, 'null'], x-pii: true }
        email: { type: [string, 'null'], x-pii: true }
        userType: { type: string, enum: [FINANCIAL_INSTITUTION_USER, PARTNER_USER, KINECTIVE_EMPLOYEE, SYSTEM_ADMINISTRATOR], x-pii: false }
        ciRole: { type: [string, 'null'], enum: [admin, user, service_provider, null], x-pii: false }
        hasEnterpriseAccess: { type: boolean }
        locations: { type: array, items: { $ref: '#/components/schemas/LocationRef' } }
        lastSeenAt: { type: [string, 'null'], format: date-time, x-pii: false }
    UserAccessWrite:
      type: object
      required: [ciRole]
      properties:
        ciRole: { type: [string, 'null'], enum: [admin, user, service_provider, null], description: Null removes access., x-pii: false }
        locationIds: { type: array, items: { type: integer } }
        hasEnterpriseAccess: { type: boolean, description: Admin only. }
    ServicedModels:
      type: object
      required: [deviceModelIds]
      properties:
        deviceModelIds: { type: array, items: { type: integer } }
    Profile:
      type: object
      required: [displayName, ciRole, branches]
      properties:
        displayName: { type: [string, 'null'], x-pii: true }
        email: { type: [string, 'null'], x-pii: true }
        phone: { type: [string, 'null'], x-pii: true }
        ciRole: { type: string, enum: [admin, user, service_provider], x-pii: false }
        allBranches: { type: boolean, description: True with enterprise access ("All branches / sites"). }
        branches: { type: array, items: { $ref: '#/components/schemas/LocationRef' } }
    ExportJob:
      type: object
      required: [exportId, status]
      properties:
